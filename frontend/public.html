<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <script>try{const t=localStorage.getItem("public-theme");document.documentElement.dataset.theme=t==="dark"?"dark":"light"}catch{document.documentElement.dataset.theme="light"}</script>
    <style>html,body{background:#f7f5fa}html[data-theme="dark"],html[data-theme="dark"] body{background:#17131d}</style>
    <title>Nore Proxy</title>
  </head>
  <body>
    <!--
      Painted before the bundle runs so the toggle does not appear a frame late
      on every navigation. src/public/main.ts removes it as it mounts the real
      control; themePill.css derives its state from the data-theme set above.
    -->
    <div class="public-utility theme-pill-placeholder" id="theme-pill-placeholder" aria-hidden="true">
      <div class="public-utility-inner">
        <div class="theme-pill">
          <span class="thumb"></span>
          <button type="button" tabindex="-1"><span class="glyph">&#9728;</span></button>
          <button type="button" tabindex="-1"><span class="glyph">&#9782;</span></button>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/public/main.ts"></script>
  </body>
</html>
