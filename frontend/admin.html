<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("admin-theme")||"light"}catch{document.documentElement.dataset.theme="light"}</script>
    <style>html,body{background:#f8f7fb}html[data-theme="dark"],html[data-theme="dark"] body{background:#19151e}</style>
    <title>Admin — Nore Proxy</title>
  </head>
  <body>
    <!--
      Painted before the bundle runs so the toggle does not appear a frame late
      on every navigation. src/admin/main.ts removes it as it mounts the real
      control; themePill.css derives its state from the data-theme set above.
    -->
    <div class="admin-utility theme-pill-placeholder" id="theme-pill-placeholder" aria-hidden="true">
      <div class="theme-pill">
        <span class="thumb"></span>
        <button type="button" tabindex="-1"><span class="glyph">&#9728;</span></button>
        <button type="button" tabindex="-1"><span class="glyph">&#9782;</span></button>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
