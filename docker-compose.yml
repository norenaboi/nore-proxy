services:
  nore-proxy:
    build: .
    container_name: nore-proxy
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      ENDPOINTS_PATH: /app/data/endpoints.json
      MODELS_PATH: /app/data/models.json
      SETTINGS_PATH: /app/data/settings.json
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8741:8741"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nore-proxy-network

networks:
  nore-proxy-network:
    driver: bridge
